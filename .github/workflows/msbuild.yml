# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: MSBuild

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Cancel superseded in-progress runs for the same ref.
concurrency:
  group: msbuild-${{ github.ref }}
  cancel-in-progress: true

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .

  # Configuration type to build.
  BUILD_CONFIGURATION: Release

permissions:
  contents: read
  checks: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore NuGet packages
      run: nuget restore ${{ env.SOLUTION_FILE_PATH }}

    # Single build of the solution. The unit tests below reuse its output: the wixext embeds the
    # Build the custom action DLL for the non-x64 platforms first: the wixlib compiles its
    # x86/ARM64 fragments (and embeds those DLLs) only when the outputs exist.
    - name: Build x86 and ARM64 custom action DLLs
      run: |
        # Diagnostic: list the platform toolsets available on this runner image.
        Get-ChildItem "C:\Program Files\Microsoft Visual Studio\*\*\MSBuild\Microsoft\VC\*\Platforms\*\PlatformToolsets\*" -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
        msbuild /m /p:Configuration=${{ env.BUILD_CONFIGURATION }} /p:Platform=Win32 /p:SolutionDir=${{ github.workspace }}\ src\ca\jsonca.vcxproj
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        msbuild /m /p:Configuration=${{ env.BUILD_CONFIGURATION }} /p:Platform=ARM64 /p:SolutionDir=${{ github.workspace }}\ src\ca\jsonca.vcxproj
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    # wixlib produced here, and the C++ test project links the WiX native packages restored above.
    - name: Build
      run: msbuild /m /p:Configuration=${{ env.BUILD_CONFIGURATION }} ${{ env.SOLUTION_FILE_PATH }}

    # continue-on-error so both suites always run and produce result files; the reporter steps below
    # fail the job if there are test failures. SolutionDir is passed so the wixext PostBuild xcopy
    # target resolves when the test project builds the wixext outside of the .sln.
    - name: Run C# unit tests
      continue-on-error: true
      run: >
        dotnet test test/WixJsonFileExtension.Tests/WixJsonFileExtension.Tests.csproj
        --configuration ${{ env.BUILD_CONFIGURATION }}
        -p:SolutionDir=${{ github.workspace }}\
        --logger "trx;LogFileName=csharp-tests.trx"
        --results-directory ${{ github.workspace }}\TestResults

    - name: Build C++ unit tests
      run: msbuild /p:Configuration=${{ env.BUILD_CONFIGURATION }} /p:Platform=x64 test\jsonca.tests\jsonca.tests.vcxproj

    - name: Run C++ unit tests
      continue-on-error: true
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path TestResults | Out-Null
        $exe = Get-ChildItem -Path "test\jsonca.tests" -Filter "jsonca.tests.exe" -Recurse | Select-Object -First 1
        if (-not $exe) { Write-Error "jsonca.tests.exe not found"; exit 1 }
        Write-Host "Running $($exe.FullName)"
        & $exe.FullName "$env:GITHUB_WORKSPACE\TestResults\cpp-tests.xml"
        Write-Host "C++ tests exit code: $LASTEXITCODE"

    - name: Publish C# test results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: C# Unit Tests
        path: TestResults/csharp-tests.trx
        reporter: dotnet-trx

    - name: Publish C++ test results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: C++ Unit Tests
        path: TestResults/cpp-tests.xml
        reporter: java-junit

    # The command-line harness runs the same transform code as the custom action; drive it once
    # through an apply, a dry run and a readValue so a packaging or argument-parsing regression
    # is caught here rather than by a user.
    - name: Smoke test jsoncli harness
      shell: pwsh
      run: |
        $cli = "x64\${{ env.BUILD_CONFIGURATION }}\jsoncli.exe"
        if (-not (Test-Path $cli)) { Write-Error "jsoncli.exe not built at $cli"; exit 1 }
        $f = Join-Path $env:RUNNER_TEMP "jsoncli-smoke.json"
        '{ "app": { "level": "Information", "tags": ["a"] } }' | Set-Content $f -Encoding UTF8

        & $cli setValue $f '$.app.level' Warning --dry-run
        if ($LASTEXITCODE -ne 0) { Write-Error "dry run failed"; exit 1 }
        if ((Get-Content $f -Raw | ConvertFrom-Json).app.level -ne 'Information') { Write-Error "dry run modified the file"; exit 1 }

        & $cli setValue $f '$.app.level' Warning
        if ($LASTEXITCODE -ne 0) { Write-Error "setValue failed"; exit 1 }
        & $cli appendArray $f '$.app.tags' b
        if ($LASTEXITCODE -ne 0) { Write-Error "appendArray failed"; exit 1 }
        $j = Get-Content $f -Raw | ConvertFrom-Json
        if ($j.app.level -ne 'Warning' -or @($j.app.tags).Count -ne 2) { Write-Error "jsoncli did not apply the operations"; exit 1 }

        $read = & $cli readValue $f '$.app.level' --quiet
        if ($LASTEXITCODE -ne 0 -or "$read".Trim() -ne 'Warning') { Write-Error "readValue returned '$read'"; exit 1 }

        & $cli setValue $f '$.app.missing' x --only-if-exists --quiet
        if ($LASTEXITCODE -ne 0) { Write-Error "OnlyIfExists skip should succeed"; exit 1 }
        & $cli setValue $f '$.app.missing' x --quiet
        if ($LASTEXITCODE -eq 0) { Write-Error "setValue on a missing path should fail"; exit 1 }
        Write-Host "jsoncli harness smoke test passed"
        # The step's exit code is the last native command's unless set explicitly, and that last
        # command is an expected failure.
        exit 0

    - name: Pack
      working-directory: ${{ env.SOLUTION_FILE_PATH }}\src\wixext\
      run: dotnet pack --no-build --configuration ${{ env.BUILD_CONFIGURATION }} /p:Version=6.0.0.${{ github.run_number }}

    # The wixextN/ folder names are how WiX finds the extension: the .targets file probes
    # ..\$(WixToolsetExtensionPackageFolder)\, which the toolset sets to wixext4, wixext5, wixext6
    # or wixext7. A missing folder is what makes WiX report the extension as unsupported, so fail
    # the build here rather than shipping a package that only works on some versions.
    - name: Verify package layout
      shell: pwsh
      working-directory: ${{ env.SOLUTION_FILE_PATH }}\src\wixext\bin\${{ env.BUILD_CONFIGURATION }}\
      run: |
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $nupkg = Get-ChildItem -Filter "*.nupkg" | Select-Object -First 1
        if (-not $nupkg) { Write-Error "No .nupkg found"; exit 1 }
        $zip = [System.IO.Compression.ZipFile]::OpenRead($nupkg.FullName)
        $entries = $zip.Entries.FullName
        $zip.Dispose()
        $entries | Sort-Object | ForEach-Object { Write-Host "  $_" }
        $missing = @("wixext4/WixJsonFileExtension.dll",
                     "wixext5/WixJsonFileExtension.dll",
                     "wixext6/WixJsonFileExtension.dll",
                     "wixext7/WixJsonFileExtension.dll",
                     "tools/jsoncli.exe") | Where-Object { $entries -notcontains $_ }
        if ($missing) { Write-Error "Missing from $($nupkg.Name): $($missing -join ', ')"; exit 1 }
        Write-Host "Package contains extension binaries for WiX 4, 5, 6 and 7, and the jsoncli harness."

    # Consume the freshly packed .nupkg exactly the way a user does - a PackageReference in a
    # wixproj - once per supported WiX major version. This is the scenario from issue #45: the
    # extension's .targets file probes ..\$(WixToolsetExtensionPackageFolder)\, and when that
    # folder is missing the extension lands in UnsupportedWixExtension and the build reports it as
    # unsupported. Passing the assembly with -ext instead would bypass exactly the mechanism that
    # was broken, so the test has to go through the package.
    #
    # Building test\smoke\Smoke.wxs additionally proves, for each version, that the extension
    # assembly loads against that toolset's WixToolset.Extensibility, that the compiler extension
    # parses every element the extension contributes, and that the embedded wixlib links.
    - name: Consume package with WiX 4, 5, 6 and 7
      shell: pwsh
      run: |
        $version = "6.0.0.${{ github.run_number }}"
        $feed = "${{ github.workspace }}\src\wixext\bin\${{ env.BUILD_CONFIGURATION }}"
        $work = "${{ github.workspace }}\.consume"
        New-Item -ItemType Directory -Force -Path $work | Out-Null

        # Restore from the pack output only, plus nuget.org for the WiX SDK itself. NuGet walks up
        # from each project directory, so one config at the root covers all of them.
        @"
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <clear />
            <add key="local" value="$feed" />
            <add key="nuget" value="https://api.nuget.org/v3/index.json" />
          </packageSources>
        </configuration>
        "@ | Set-Content "$work\nuget.config" -Encoding UTF8

        # Each project gets its own directory: sibling projects in one directory would share
        # obj\project.assets.json and clobber each other's restore.
        foreach ($sdk in @("4.0.6", "5.0.2", "6.0.1", "7.0.0")) {
          $major = $sdk.Split(".")[0]
          $dir = "$work\wix$major"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "${{ github.workspace }}\test\smoke\Smoke.wxs" $dir
          $proj = "$dir\consume.wixproj"
          @"
        <Project Sdk="WixToolset.Sdk/$sdk">
          <PropertyGroup>
            <Platforms>x64</Platforms>
            <OutputName>Smoke-wix$major</OutputName>
          </PropertyGroup>
          <ItemGroup>
            <PackageReference Include="WixJsonFileExtension" Version="$version" />
          </ItemGroup>
        </Project>
        "@ | Set-Content $proj -Encoding UTF8

          Write-Host "::group::WiX $sdk consuming WixJsonFileExtension $version"
          # AcceptEula is only meaningful to WiX 7 (Open Source Maintenance Fee EULA, error
          # WIX7015); older toolsets ignore the property. See https://wixtoolset.org/osmf/
          $out = dotnet build $proj -c ${{ env.BUILD_CONFIGURATION }} -p:Platform=x64 -p:AcceptEula=wix7 -v normal 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          Write-Host "::endgroup::"
          if ($code -ne 0) { Write-Error "WiX $sdk failed to build against the packed extension"; exit $code }

          # Both WiX 5 and WiX 7 only *warn* when an extension has no binary for their version
          # (v7 codes it WIX1031); the build then fails later on the unparsed Json elements. Assert
          # on the warning too, so this step reports the issue #45 symptom directly instead of
          # leaving it to be inferred from a cascade of "unhandled extension element" errors.
          if ($out -match "does not have support for WiX Toolset|does not support WiX Toolset") {
            Write-Error "WiX $sdk reported the extension as unsupported - the wixext$major/ folder is missing or unusable"
            exit 1
          }

          $msi = Get-ChildItem -Path $work -Filter "Smoke-wix$major.msi" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $msi) { Write-Error "WiX $sdk reported success but produced no MSI"; exit 1 }
          Write-Host "WiX $sdk built $($msi.FullName)"
        }

    - name: Upload NuGet Package
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package
        path: ${{ env.SOLUTION_FILE_PATH }}\src\wixext\bin\${{ env.BUILD_CONFIGURATION }}\*.nupkg
