name: Regression Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  SOLUTION_FILE_PATH: .
  BUILD_CONFIGURATION: Release

permissions:
  contents: read

jobs:
  regression-tests:
    name: Regression Tests
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    # Build the custom action DLL for the non-x64 platforms first: the wixlib compiles its
    # x86/ARM64 fragments (and embeds those DLLs) only when the outputs exist, and the test
    # installer should exercise the same multi-platform wixlib that gets released.
    - name: Build x86 and ARM64 custom action DLLs
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: |
        msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:Platform=Win32 /p:SolutionDir=${{ github.workspace }}\ src\ca\jsonca.vcxproj
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:Platform=ARM64 /p:SolutionDir=${{ github.workspace }}\ src\ca\jsonca.vcxproj
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Build Solution
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} ${{env.SOLUTION_FILE_PATH}}

    - name: Verify Test Installer Output
      shell: pwsh
      run: |
        Write-Host "Checking for MSI files in TestJsonConfigInstaller build output"

        # Try multiple possible output paths (x64 platform may create different structure)
        $possiblePaths = @(
          "TestJsonConfigInstaller\bin\${{env.BUILD_CONFIGURATION}}",
          "TestJsonConfigInstaller\bin\${{env.BUILD_CONFIGURATION}}\x64",
          "TestJsonConfigInstaller\bin\x64\${{env.BUILD_CONFIGURATION}}"
        )

        $foundPath = $null
        foreach ($path in $possiblePaths) {
          if (Test-Path $path) {
            Write-Host "Found build output directory: $path"
            $foundPath = $path
            break
          }
        }

        if (-not $foundPath) {
          Write-Error "Build output directory not found in any expected location"
          Write-Host "Searched paths:"
          foreach ($path in $possiblePaths) {
            Write-Host "  - $path"
          }
          exit 1
        }

        # List all files for debugging
        Write-Host "Directory contents:"
        Get-ChildItem -Path $foundPath -Recurse | Select-Object FullName | Format-Table -AutoSize

        # Find the MSI file
        $msiFiles = Get-ChildItem -Path $foundPath -Filter "*.msi" -Recurse
        if ($msiFiles.Count -gt 0) {
          $msiPath = $msiFiles[0].FullName
          Write-Host "✓ Test installer built successfully: $msiPath"
          $fileInfo = Get-Item $msiPath
          Write-Host "  Size: $($fileInfo.Length) bytes"
          Write-Host "  Modified: $($fileInfo.LastWriteTime)"
        } else {
          Write-Error "✗ Test installer MSI not found in $foundPath"
          Write-Host "This may indicate the TestJsonConfigInstaller project did not build successfully."
          exit 1
        }

    - name: Upload Test Installer
      uses: actions/upload-artifact@v4
      with:
        name: test-installer
        path: |
          TestJsonConfigInstaller\bin\${{env.BUILD_CONFIGURATION}}\**\*.msi
          TestJsonConfigInstaller\bin\**\${{env.BUILD_CONFIGURATION}}\**\*.msi
        if-no-files-found: error

    # ---------------------------------------------------------------------------
    # End-to-end flag-type regression coverage.
    #
    # These steps install the real test MSI and assert the *extension's* behaviour
    # by inspecting the JSON files it writes (and, where there is no file artifact,
    # the install log). Each individual check and its outcome is also written to the
    # GitHub job summary so the run reports exactly which tests ran and passed/failed.
    #
    # Coverage (happy + sad/variation) for every JsonFile flag:
    #   readValue, setValue, replaceJsonValue, createJsonPointerValue, deleteValue,
    #   appendArray, insertArray (Index 0 and -1), removeArrayElement, distinctValues,
    #   validateSchema, OnlyIfExists, non-ASCII values, invalid JSON.
    # Plus the On attribute (install / uninstall / both timing) across the whole product
    # lifecycle: install, repair, major upgrade to a second build of the same package, uninstall.
    # ---------------------------------------------------------------------------

    - name: Prepare readValue source file
      shell: pwsh
      run: |
        function Note([string]$line) { $line | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }
        Note "# Regression Test Report"
        Note ""
        Note "## Setup"
        Note ""
        Note "| Result | Check |"
        Note "| --- | --- |"

        # readValue (WixPropertyJsonFile) runs after CostFinalize, i.e. BEFORE InstallFiles, so it
        # cannot read a file installed in the same transaction. The test installer therefore reads
        # this pre-existing file from a fixed location.
        $dir = "C:\JsonRegression"
        New-Item -ItemType Directory -Force -Path $dir | Out-Null
        $source = @"
        {
          "config": {
            "environment": "Staging"
          }
        }
        "@
        $readSrc = Join-Path $dir "read-source.json"
        $source | Out-File -FilePath $readSrc -Encoding UTF8

        # Validate the fixture up front so a setup failure here is never mistaken for a readValue
        # custom-action bug later (readValue silently leaves the property unset if the file is absent).
        $ok = (Test-Path $readSrc)
        if ($ok) {
          $probe = Get-Content -Path $readSrc -Raw -Encoding UTF8 | ConvertFrom-Json
          $ok = ($probe.config.environment -eq 'Staging')
        }
        if ($ok) {
          Note "| ✅ | Created and verified readValue source ($readSrc) |"
          Write-Host "✓ Created and verified $readSrc"
        } else {
          Note "| ❌ | Failed to create/verify readValue source ($readSrc) |"
          Write-Host "✗ Failed to create/verify $readSrc"
          exit 1
        }

        # Seed the fixture for the On attribute (install/uninstall timing) regression. It lives
        # outside the install directory because it has to outlive the product: the uninstall-time
        # rows edit it after the product's own files are gone, and the assertions read it back
        # after each of install, repair, upgrade and uninstall (see LifecycleComponent in
        # Product.wxs for the expected state after each step).
        $lifecycle = Join-Path $dir "lifecycle.json"
        '{ "lifecycle": { "installed": false, "phase": "none" } }' | Out-File -FilePath $lifecycle -Encoding UTF8
        $probe = Get-Content -Path $lifecycle -Raw -Encoding UTF8 | ConvertFrom-Json
        if ($probe.lifecycle.installed -eq $false -and $probe.lifecycle.phase -eq 'none') {
          Note "| ✅ | Seeded On-timing fixture ($lifecycle) |"
          Write-Host "✓ Seeded $lifecycle"
        } else {
          Note "| ❌ | Failed to seed On-timing fixture ($lifecycle) |"
          Write-Host "✗ Failed to seed $lifecycle"
          exit 1
        }

    - name: Install test MSI (happy path)
      shell: pwsh
      run: |
        function Note([string]$line) { $line | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }
        Note ""
        Note "## Install (happy path)"
        Note ""
        Note "| Result | Check |"
        Note "| --- | --- |"

        $msi = (Get-ChildItem -Path "TestJsonConfigInstaller\bin" -Filter "*.msi" -Recurse | Select-Object -First 1).FullName
        if (-not $msi) { Note "| ❌ | Test installer MSI not found |"; Write-Host "✗ MSI not found"; exit 1 }
        Write-Host "Installing: $msi"

        $log = Join-Path $env:RUNNER_TEMP "happy-install.log"
        Remove-Item -Path $log -ErrorAction SilentlyContinue

        # MY_VALUE uses Cyrillic text to also regression-test non-ASCII (UTF-8) value handling.
        # Passing it as its own Start-Process argument keeps it Unicode-safe.
        $expectedCategory = "КатегорияПривет"
        $argline = "/i `"$msi`" /qn /norestart /l*v `"$log`" MY_VALUE=$expectedCategory LOG_DIRECTORY=C:\temp\"
        $p = Start-Process -FilePath "msiexec.exe" -ArgumentList $argline -Wait -PassThru
        Write-Host "msiexec exit code: $($p.ExitCode)"

        if ($p.ExitCode -eq 0 -or $p.ExitCode -eq 3010) {
          Note "| ✅ | MSI install succeeded (exit $($p.ExitCode)) |"
          Write-Host "✓ Happy-path install succeeded"
        } else {
          Note "| ❌ | MSI install failed (exit $($p.ExitCode)) |"
          Write-Host "✗ Happy-path install failed"
          if (Test-Path $log) { Write-Host "----- msiexec log -----"; Get-Content -Path $log }
          exit 1
        }

    - name: Verify all flag types in installed JSON (happy paths)
      shell: pwsh
      run: |
        $failed = $false
        function Note([string]$line) { $line | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }
        function Check([bool]$cond, [string]$msg) {
          if ($cond) { Write-Host "  [PASS] $msg"; Note "| ✅ | $msg |" }
          else { Write-Host "  [FAIL] $msg"; Note "| ❌ | $msg |"; $script:failed = $true }
        }

        Note ""
        Note "## Installed-JSON flag-type assertions"
        Note ""
        Note "| Result | Check |"
        Note "| --- | --- |"

        $expectedCategory = "КатегорияПривет"
        $installDir = Join-Path $env:ProgramFiles "TestJsonConfigInstaller"

        $appPath = Join-Path $installDir "appsettings.json"
        $cfgPath = Join-Path $installDir "config.json"
        $setPath = Join-Path $installDir "settings.json"

        foreach ($f in @($appPath, $cfgPath, $setPath)) {
          if (-not (Test-Path $f)) { Note "| ❌ | Expected installed file missing: $f |"; Write-Host "✗ Missing $f"; exit 1 }
        }

        $j = Get-Content -Path $appPath -Raw -Encoding UTF8 | ConvertFrom-Json

        Write-Host "replaceJsonValue / setValue (filter) / non-ASCII:"
        $books = @($j.store.book)
        $moby = $books | Where-Object { $_.isbn -eq '0-553-21311-3' } | Select-Object -First 1
        Check ($null -ne $moby) "replaceJsonValue: book with isbn 0-553-21311-3 exists"
        Check ($moby.author -eq 'HermanMelville') "replaceJsonValue replaced array contents from MY_BOOKS"
        Check ($moby.category -eq $expectedCategory) "setValue (JSONPath filter) wrote non-ASCII value to category"

        Write-Host "appendArray / insertArray / removeArrayElement (on store.book):"
        Check ($books.Count -eq 3) "net array size is 3 (append + insert@0 - remove price>20)"
        Check ($books[0].title -eq 'Steve Jobs') "insertArray placed 'Steve Jobs' at index 0"
        Check ((@($books | Where-Object { $_.title -eq 'Cosmos' })).Count -eq 1) "appendArray added 'Cosmos'"
        Check ((@($books | Where-Object { $_.author -eq 'NigelRees' })).Count -eq 0) "removeArrayElement removed books priced > 20"

        Write-Host "insertArray Index variations / appendArray (on isolated arrayOps):"
        $ao = @($j.arrayOps)
        Check ($ao.Count -eq 4) "arrayOps has 4 elements after insert(0)/insert(-1)/append"
        Check ($ao[0] -eq 'first') "insertArray Index=0 inserted 'first' at front"
        Check ($ao[1] -eq 'seed') "original 'seed' element retained in order"
        Check ($ao[2] -eq 'last') "insertArray Index=-1 appended 'last'"
        Check ($ao[3] -eq 'appended') "appendArray added 'appended' at the end"

        Write-Host "setValue (multi-select recursive descent):"
        $prices = @($books.price) + @($j.store.bicycle.price)
        $offPrice = @($prices | Where-Object { [math]::Abs([double]$_ - 9.99) -gt 0.001 })
        Check ($offPrice.Count -eq 0) "`$..price multi-select set every price (books + bicycle) to 9.99"

        Write-Host "deleteValue (wildcard):"
        $withOldPrice = @($books | Where-Object { $_.PSObject.Properties.Name -contains 'OldPrice' })
        Check ($withOldPrice.Count -eq 0) "deleteValue removed OldPrice from all books"

        Write-Host "createJsonPointerValue:"
        Check ($j.NonExisting -eq 'Value Not Set') "createJsonPointerValue created top-level /NonExisting"

        Write-Host "setValue (deeply nested) using LOG_DIRECTORY property:"
        $logPath = $j.Serilog.WriteTo[0].Args.configure[0].Args.path
        Check ($logPath -like 'C:\temp\PowerCommunications*CommunicationService.Outgoing-.log') "nested setValue substituted [LOG_DIRECTORY] and kept the literal suffix"

        Write-Host "OnlyIfExists:"
        Check ($j.expensive -eq 15) "OnlyIfExists=yes updated existing 'expensive' to 15"
        Check (-not ($j.PSObject.Properties.Name -contains 'nonExistentPath')) "OnlyIfExists=yes skipped missing 'nonExistentPath'"

        Write-Host "distinctValues:"
        $tags = @($j.tags)
        Check ($tags.Count -eq 4) "distinctValues de-duplicated tags (6 -> 4)"
        Check ((@($tags | Select-Object -Unique)).Count -eq $tags.Count) "tags contain no duplicates"
        $feat = @($j.features.enabled)
        Check ($feat.Count -eq 3) "distinctValues de-duplicated features.enabled (4 -> 3)"

        Write-Host "setValue on a template file:"
        $cfg = Get-Content -Path $cfgPath -Raw -Encoding UTF8 | ConvertFrom-Json
        Check ($cfg.Application.Name -eq 'MyInstalledApp') "setValue updated Application.Name in template config"

        Write-Host "createJsonPointerValue building a file from '{}':"
        $set = Get-Content -Path $setPath -Raw -Encoding UTF8 | ConvertFrom-Json
        Check ($set.Application.Name -eq 'MyApplication') "built Application.Name from empty file"
        Check ($set.Application.Version -eq '2.0.0') "built Application.Version from empty file"
        Check ($set.Logging.Level -eq 'Debug') "built Logging.Level from empty file"

        Write-Host "readValue (verified via written-back file content):"
        Check ($set.ReadResults.Present -eq 'Staging') "readValue read existing element ('Staging') -> written back to file"
        Check ($set.ReadResults.Missing -eq 'READ_DEFAULT') "readValue applied DefaultValue for missing element -> written back to file"

        if ($script:failed) { Write-Host "`nOne or more flag-type assertions FAILED"; exit 1 }
        Write-Host "`n✓ All installed-JSON flag-type assertions passed"

    - name: Verify validateSchema (happy path) from install log
      shell: pwsh
      run: |
        $failed = $false
        function Note([string]$line) { $line | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }
        function Check([bool]$cond, [string]$msg) {
          if ($cond) { Write-Host "  [PASS] $msg"; Note "| ✅ | $msg |" }
          else { Write-Host "  [FAIL] $msg"; Note "| ❌ | $msg |"; $script:failed = $true }
        }

        Note ""
        Note "## validateSchema (happy path)"
        Note ""
        Note "| Result | Check |"
        Note "| --- | --- |"

        $log = Join-Path $env:RUNNER_TEMP "happy-install.log"
        if (-not (Test-Path $log)) { Note "| ❌ | Install log not found |"; Write-Host "✗ log missing"; exit 1 }
        $content = Get-Content -Path $log -Raw

        # The validator logs this only when SchemaFile validation actually ran and passed.
        Check ($content -match [regex]::Escape("JSON schema validation successful")) "SchemaFile validation passed for the valid file"

        if ($script:failed) { exit 1 }
        Write-Host "`n✓ validateSchema (happy) assertion passed"

    # ---------------------------------------------------------------------------
    # On attribute (install / uninstall / both timing) across the product lifecycle.
    #
    # LifecycleComponent in Product.wxs edits C:\JsonRegression\lifecycle.json with rows timed
    # On="install", On="uninstall" and On="both" (including an uninstall-time readValue), and
    # ProductComponent carries an On="uninstall" row against the installed appsettings.json.
    # Each transaction below passes LIFECYCLE_PHASE so the On="both" row records which one ran it.
    # ---------------------------------------------------------------------------

    - name: Verify On timing after install
      shell: pwsh
      run: |
        $failed = $false
        function Note([string]$line) { $line | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }
        function Check([bool]$cond, [string]$msg) {
          if ($cond) { Write-Host "  [PASS] $msg"; Note "| ✅ | $msg |" }
          else { Write-Host "  [FAIL] $msg"; Note "| ❌ | $msg |"; $script:failed = $true }
        }

        Note ""
        Note "## On timing: after install"
        Note ""
        Note "| Result | Check |"
        Note "| --- | --- |"

        $lc = Get-Content -Path "C:\JsonRegression\lifecycle.json" -Raw -Encoding UTF8 | ConvertFrom-Json
        Check ($lc.lifecycle.installed -eq $true) "On=install setValue ran (installed=true)"
        Check ($lc.lifecycle.marker -eq 'present') "On=install createJsonPointerValue ran (marker=present)"
        Check ($lc.lifecycle.phase -eq 'install') "On=both setValue ran at install time (phase=install)"
        Check (-not ($lc.lifecycle.PSObject.Properties.Name -contains 'readBack')) "On=uninstall rows did not run at install time (no readBack)"

        # The On=uninstall row against the installed file must not have touched it.
        $appPath = Join-Path (Join-Path $env:ProgramFiles "TestJsonConfigInstaller") "appsettings.json"
        $j = Get-Content -Path $appPath -Raw -Encoding UTF8 | ConvertFrom-Json
        Check ($j.expensive -eq 15) "On=uninstall setValue on the installed file did not run at install time (expensive still 15)"

        # Both schedulers are sequenced; the uninstall-time one ran as a no-op.
        $log = Get-Content -Path (Join-Path $env:RUNNER_TEMP "happy-install.log") -Raw
        Check ($log -match "Action start [\d:]+: WixSchedJsonFileUninstall_X64\.") "uninstall-time scheduler is sequenced in the install transaction"
        Check ($log -match "Action start [\d:]+: WixSchedJsonFile_X64\.") "install-time scheduler is sequenced in the install transaction"

        if ($script:failed) { Write-Host "`nOn-timing (install) assertions FAILED"; exit 1 }
        Write-Host "`n✓ On-timing (install) assertions passed"

    - name: Repair product and verify On timing
      shell: pwsh
      run: |
        $failed = $false
        function Note([string]$line) { $line | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }
        function Check([bool]$cond, [string]$msg) {
          if ($cond) { Write-Host "  [PASS] $msg"; Note "| ✅ | $msg |" }
          else { Write-Host "  [FAIL] $msg"; Note "| ❌ | $msg |"; $script:failed = $true }
        }

        Note ""
        Note "## On timing: repair"
        Note ""
        Note "| Result | Check |"
        Note "| --- | --- |"

        $msi = (Get-ChildItem -Path "TestJsonConfigInstaller\bin" -Filter "*.msi" -Recurse | Select-Object -First 1).FullName
        $log = Join-Path $env:RUNNER_TEMP "repair.log"
        Remove-Item -Path $log -ErrorAction SilentlyContinue

        # A repair with public properties has to be spelled /i + REINSTALL=ALL: msiexec's /f switch
        # accepts no property assignments (anything after the package is silently dropped, as the
        # "Command Line:" entry in the log shows). REINSTALLMODE=amus reinstalls every file, so the
        # install-time rows run again on a fresh appsettings.json exactly as on first install. The
        # uninstall-time rows must stay idle: a repair is not a removal.
        $p = Start-Process -FilePath "msiexec.exe" -ArgumentList "/i `"$msi`" REINSTALL=ALL REINSTALLMODE=amus /qn /norestart /l*v `"$log`" LIFECYCLE_PHASE=repair LOG_DIRECTORY=C:\temp\" -Wait -PassThru
        Write-Host "repair exit code: $($p.ExitCode)"
        Check ($p.ExitCode -eq 0 -or $p.ExitCode -eq 3010) "MSI repair succeeded (exit $($p.ExitCode))"
        if (-not ($p.ExitCode -eq 0 -or $p.ExitCode -eq 3010) -and (Test-Path $log)) { Write-Host "----- repair log -----"; Get-Content -Path $log }

        # Diagnostics: component states the engine decided on, the property as seen by the
        # install session, and everything the extension logged.
        Write-Host "----- repair log: component states / properties / extension -----"
        if (Test-Path $log) {
          Get-Content -Path $log | Where-Object { $_ -match "Component: (LifecycleComponent|ProductComponent)|LIFECYCLE_PHASE|REINSTALL|JsonFile|Action start [\d:]+: (WixSched|WixExec|WixProperty)" } | ForEach-Object { Write-Host $_ }
        }
        Write-Host "----- lifecycle.json after repair -----"
        Get-Content -Path "C:\JsonRegression\lifecycle.json" -Raw -Encoding UTF8 | Write-Host

        $lc = Get-Content -Path "C:\JsonRegression\lifecycle.json" -Raw -Encoding UTF8 | ConvertFrom-Json
        Check ($lc.lifecycle.phase -eq 'repair') "On=both setValue ran at repair time (phase=repair)"
        Check ($lc.lifecycle.installed -eq $true) "On=install rows ran on repair (installed=true)"
        Check ($lc.lifecycle.marker -eq 'present') "marker still present after repair"
        Check (-not ($lc.lifecycle.PSObject.Properties.Name -contains 'readBack')) "On=uninstall rows did not run on repair (no readBack)"

        if ($script:failed) {
          Write-Host "`nOn-timing (repair) assertions FAILED"
          if (Test-Path $log) { Write-Host "----- full repair log -----"; Get-Content -Path $log }
          exit 1
        }
        Write-Host "`n✓ On-timing (repair) assertions passed"

    # A major upgrade needs a second package with a higher version and its own ProductCode.
    # Product.wxs takes the version from the TestProductVersion preprocessor variable (default
    # 1.0.0.0) and auto-generates the ProductCode, so the same sources build the upgrade package.
    # Separate output and intermediate directories keep it apart from the v1 build the other steps
    # pick up from TestJsonConfigInstaller\bin.
    - name: Build v2 test installer for the major upgrade
      shell: pwsh
      run: |
        msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:Platform=x64 /p:DefineConstants="TestProductVersion=2.0.0.0" /p:OutputPath=..\upgrade-msi\ /p:IntermediateOutputPath=..\upgrade-obj\ /p:OutputName=TestJsonConfigInstaller-v2 TestJsonConfigInstaller\TestJsonConfigInstaller.wixproj
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $msi2 = Get-ChildItem -Path "upgrade-msi" -Filter "TestJsonConfigInstaller-v2.msi" -Recurse | Select-Object -First 1
        if (-not $msi2) { Write-Error "v2 test installer not found under upgrade-msi"; exit 1 }
        Write-Host "✓ Built v2 test installer: $($msi2.FullName)"

    - name: Major upgrade to v2 and verify On timing
      shell: pwsh
      run: |
        $failed = $false
        function Note([string]$line) { $line | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }
        function Check([bool]$cond, [string]$msg) {
          if ($cond) { Write-Host "  [PASS] $msg"; Note "| ✅ | $msg |" }
          else { Write-Host "  [FAIL] $msg"; Note "| ❌ | $msg |"; $script:failed = $true }
        }

        Note ""
        Note "## On timing: major upgrade"
        Note ""
        Note "| Result | Check |"
        Note "| --- | --- |"

        $msi2 = (Get-ChildItem -Path "upgrade-msi" -Filter "TestJsonConfigInstaller-v2.msi" -Recurse | Select-Object -First 1).FullName
        $log = Join-Path $env:RUNNER_TEMP "upgrade.log"
        Remove-Item -Path $log -ErrorAction SilentlyContinue

        # RemoveExistingProducts (afterInstallValidate) uninstalls v1 - running its On=uninstall rows,
        # with v1's own default LIFECYCLE_PHASE - before v2's InstallFiles and On=install rows run
        # with the LIFECYCLE_PHASE passed here.
        $p = Start-Process -FilePath "msiexec.exe" -ArgumentList "/i `"$msi2`" /qn /norestart /l*v `"$log`" LIFECYCLE_PHASE=upgrade LOG_DIRECTORY=C:\temp\" -Wait -PassThru
        Write-Host "upgrade exit code: $($p.ExitCode)"
        Check ($p.ExitCode -eq 0 -or $p.ExitCode -eq 3010) "MSI major upgrade succeeded (exit $($p.ExitCode))"
        if (-not ($p.ExitCode -eq 0 -or $p.ExitCode -eq 3010) -and (Test-Path $log)) { Write-Host "----- upgrade log -----"; Get-Content -Path $log }

        $content = if (Test-Path $log) { Get-Content -Path $log -Raw } else { "" }
        Check ($content -match "Action start [\d:]+: RemoveExistingProducts\.") "RemoveExistingProducts ran (v1 was uninstalled by the upgrade)"

        $lc = Get-Content -Path "C:\JsonRegression\lifecycle.json" -Raw -Encoding UTF8 | ConvertFrom-Json
        Check ($lc.lifecycle.readBack -eq 'present') "v1's On=uninstall rows ran during the upgrade (readBack=present)"
        Check ($lc.lifecycle.marker -eq 'present') "v2's On=install rows ran after v1's removal (marker recreated)"
        Check ($lc.lifecycle.installed -eq $true) "installed=true after upgrade"
        Check ($lc.lifecycle.phase -eq 'upgrade') "On=both row last ran in the v2 install (phase=upgrade)"

        if ($script:failed) {
          Write-Host "`nOn-timing (upgrade) assertions FAILED"
          Write-Host "----- lifecycle.json after upgrade -----"
          Get-Content -Path "C:\JsonRegression\lifecycle.json" -Raw -Encoding UTF8 | Write-Host
          if (Test-Path $log) { Write-Host "----- full upgrade log -----"; Get-Content -Path $log }
          exit 1
        }
        Write-Host "`n✓ On-timing (upgrade) assertions passed"

    - name: Uninstall product and verify On timing
      shell: pwsh
      run: |
        $failed = $false
        function Note([string]$line) { $line | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }
        function Check([bool]$cond, [string]$msg) {
          if ($cond) { Write-Host "  [PASS] $msg"; Note "| ✅ | $msg |" }
          else { Write-Host "  [FAIL] $msg"; Note "| ❌ | $msg |"; $script:failed = $true }
        }

        Note ""
        Note "## On timing: uninstall"
        Note ""
        Note "| Result | Check |"
        Note "| --- | --- |"

        # v2 is the product that is installed now (the upgrade removed v1). Uninstall via the
        # package path (no ProductCode coupling; it is auto-generated per build).
        $msi2 = (Get-ChildItem -Path "upgrade-msi" -Filter "TestJsonConfigInstaller-v2.msi" -Recurse | Select-Object -First 1).FullName
        $log = Join-Path $env:RUNNER_TEMP "uninstall.log"
        Remove-Item -Path $log -ErrorAction SilentlyContinue
        $p = Start-Process -FilePath "msiexec.exe" -ArgumentList "/x `"$msi2`" /qn /norestart /l*v `"$log`" LIFECYCLE_PHASE=uninstall" -Wait -PassThru
        Write-Host "Uninstall exit code: $($p.ExitCode)"
        $ok = ($p.ExitCode -eq 0 -or $p.ExitCode -eq 3010)
        Check $ok "MSI uninstall succeeded (exit $($p.ExitCode))"
        if (-not $ok) {
          Note "| ❌ | Uninstall failed — later steps may be affected |"
          if (Test-Path $log) { Write-Host "----- uninstall log -----"; Get-Content -Path $log }
          exit 1
        }

        $lc = Get-Content -Path "C:\JsonRegression\lifecycle.json" -Raw -Encoding UTF8 | ConvertFrom-Json
        Check ($lc.lifecycle.installed -eq $false) "On=uninstall setValue reverted installed to false"
        Check (-not ($lc.lifecycle.PSObject.Properties.Name -contains 'marker')) "On=uninstall deleteValue removed the marker"
        Check ($lc.lifecycle.phase -eq 'uninstall') "On=both setValue ran at uninstall time (phase=uninstall)"
        Check ($lc.lifecycle.readBack -eq 'present') "On=uninstall readValue read the marker before it was deleted (readBack=present)"

        # Ordering proof: the uninstall-time scheduler runs before RemoveFiles, and the deferred
        # action edited the product's own appsettings.json while it still existed (had it run after
        # RemoveFiles the setValue would have failed with file-not-found and so would the uninstall).
        $content = Get-Content -Path $log -Raw
        $sched = [regex]::Match($content, "Action start [\d:]+: WixSchedJsonFileUninstall_X64\.")
        $remove = [regex]::Match($content, "Action start [\d:]+: RemoveFiles\.")
        Check ($sched.Success -and $remove.Success -and $sched.Index -lt $remove.Index) "WixSchedJsonFileUninstall is sequenced before RemoveFiles"
        Check ($content -match "Configuring JSON file: [^\r\n]*appsettings\.json") "On=uninstall row edited the installed appsettings.json during uninstall"
        $appPath = Join-Path (Join-Path $env:ProgramFiles "TestJsonConfigInstaller") "appsettings.json"
        Check (-not (Test-Path $appPath)) "installed appsettings.json was removed by the uninstall"

        if ($script:failed) {
          Write-Host "`nOn-timing (uninstall) assertions FAILED"
          Write-Host "----- lifecycle.json after uninstall -----"
          Get-Content -Path "C:\JsonRegression\lifecycle.json" -Raw -Encoding UTF8 | Write-Host
          Write-Host "----- full uninstall log -----"; Get-Content -Path $log
          exit 1
        }
        Write-Host "`n✓ On-timing (uninstall) assertions passed"

    - name: Sad path - invalid JSON aborts install
      shell: pwsh
      run: |
        $failed = $false
        function Note([string]$line) { $line | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }
        function Check([bool]$cond, [string]$msg) {
          if ($cond) { Write-Host "  [PASS] $msg"; Note "| ✅ | $msg |" }
          else { Write-Host "  [FAIL] $msg"; Note "| ❌ | $msg |"; $script:failed = $true }
        }

        Note ""
        Note "## Sad path: invalid JSON aborts install"
        Note ""
        Note "| Result | Check |"
        Note "| --- | --- |"

        $msi = (Get-ChildItem -Path "TestJsonConfigInstaller\bin" -Filter "*.msi" -Recurse | Select-Object -First 1).FullName
        $log = Join-Path $env:RUNNER_TEMP "invalid-json.log"
        Remove-Item -Path $log -ErrorAction SilentlyContinue

        # TEST_INVALID_JSON=1 enables a component that operates on malformed JSON; the custom action
        # must fail, which aborts and rolls back the installation.
        $p = Start-Process -FilePath "msiexec.exe" -ArgumentList "/i `"$msi`" /qn /norestart /l*v `"$log`" TEST_INVALID_JSON=1" -Wait -PassThru
        Write-Host "msiexec exit code: $($p.ExitCode)"

        $nonZero = ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010)
        Check $nonZero "install failed as expected (exit $($p.ExitCode))"

        # Prove the failure was actually the JSON operation, not an unrelated error.
        $content = if (Test-Path $log) { Get-Content -Path $log -Raw } else { "" }
        Check ($content -match [regex]::Escape("Failed while updating file")) "extension reported a JsonFile operation failure"
        Check ($content -match "invalid\.json") "the failing operation targeted invalid.json"

        # Best-effort cleanup in case the install unexpectedly succeeded.
        if (-not $nonZero) {
          Start-Process -FilePath "msiexec.exe" -ArgumentList "/x `"$msi`" /qn /norestart" -Wait | Out-Null
        }

        if ($script:failed) { Write-Host "`nInvalid-JSON sad-path assertions FAILED"; exit 1 }
        Write-Host "`n✓ Invalid JSON correctly aborted the install for the right reason"

    - name: Sad path - schema validation failure aborts install
      shell: pwsh
      run: |
        $failed = $false
        function Note([string]$line) { $line | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }
        function Check([bool]$cond, [string]$msg) {
          if ($cond) { Write-Host "  [PASS] $msg"; Note "| ✅ | $msg |" }
          else { Write-Host "  [FAIL] $msg"; Note "| ❌ | $msg |"; $script:failed = $true }
        }

        Note ""
        Note "## Sad path: schema validation failure aborts install"
        Note ""
        Note "| Result | Check |"
        Note "| --- | --- |"

        $msi = (Get-ChildItem -Path "TestJsonConfigInstaller\bin" -Filter "*.msi" -Recurse | Select-Object -First 1).FullName
        $log = Join-Path $env:RUNNER_TEMP "schema-failure.log"
        Remove-Item -Path $log -ErrorAction SilentlyContinue

        # TEST_SCHEMA_FAILURE=1 enables a component whose JSON is valid but violates the schema
        # (missing required "store"); schema validation must fail and abort the install.
        $p = Start-Process -FilePath "msiexec.exe" -ArgumentList "/i `"$msi`" /qn /norestart /l*v `"$log`" TEST_SCHEMA_FAILURE=1" -Wait -PassThru
        Write-Host "msiexec exit code: $($p.ExitCode)"

        $nonZero = ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010)
        Check $nonZero "install failed as expected (exit $($p.ExitCode))"

        # Prove the failure was specifically schema validation, not an unrelated error.
        $content = if (Test-Path $log) { Get-Content -Path $log -Raw } else { "" }
        Check ($content -match [regex]::Escape("Schema validation failed")) "extension reported a schema validation failure"

        if (-not $nonZero) {
          Start-Process -FilePath "msiexec.exe" -ArgumentList "/x `"$msi`" /qn /norestart" -Wait | Out-Null
        }

        if ($script:failed) { Write-Host "`nSchema-failure sad-path assertions FAILED"; exit 1 }
        Write-Host "`n✓ Schema violation correctly aborted the install for the right reason"

    - name: Verify repository test JSON fixtures
      shell: pwsh
      run: |
        $failed = $false
        function Note([string]$line) { $line | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }
        function Check([bool]$cond, [string]$msg) {
          if ($cond) { Write-Host "  [PASS] $msg"; Note "| ✅ | $msg |" }
          else { Write-Host "  [FAIL] $msg"; Note "| ❌ | $msg |"; $script:failed = $true }
        }

        Note ""
        Note "## Repository JSON fixtures"
        Note ""
        Note "| Result | Check |"
        Note "| --- | --- |"

        # Valid fixtures should parse.
        foreach ($f in @("TestJsonConfigInstaller\appsettings.json", "TestJsonConfigInstaller\appsettings.dotnet.json")) {
          $ok = $true
          try { $null = Get-Content $f -Raw | ConvertFrom-Json } catch { $ok = $false }
          Check $ok "fixture parses as valid JSON: $f"
        }

        # Intentionally invalid fixtures should NOT parse.
        foreach ($f in @("TestJsonConfigInstaller\invalid.json")) {
          $ok = $false
          try { $null = Get-Content $f -Raw | ConvertFrom-Json } catch { $ok = $true }
          Check $ok "fixture is correctly malformed: $f"
        }

        if ($script:failed) { exit 1 }

    - name: Report overall result
      if: always()
      shell: pwsh
      run: |
        function Note([string]$line) { $line | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }
        Note ""
        Note "## Overall result: ${{ job.status }}"
        Write-Host "Overall job status: ${{ job.status }}"
