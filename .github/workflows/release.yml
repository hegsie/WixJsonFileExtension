# This workflow creates a GitHub release and publishes the package to NuGet
# It is triggered manually or by pushing a version tag (e.g., v6.0.0)

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 6.0.0)'
        required: true
        type: string
  push:
    tags:
      - 'v*.*.*'

env:
  SOLUTION_FILE_PATH: .
  BUILD_CONFIGURATION: Release

permissions:
  contents: write
  # Required for NuGet Trusted Publishing: the workflow exchanges its OIDC token for a
  # short-lived NuGet.org API key instead of using a stored long-lived key.
  id-token: write

jobs:
  release:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Determine Version
      id: version
      shell: pwsh
      run: |
        if ("${{ github.event_name }}" -eq "workflow_dispatch") {
          $version = "${{ inputs.version }}"
        } else {
          $version = "${{ github.ref_name }}" -replace '^v', ''
        }
        echo "version=$version" >> $env:GITHUB_OUTPUT
        echo "Version: $version"

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    # Build every custom action architecture before signing and building the wixlib that embeds
    # them, so released packages carry signed DLLs for all three platforms.
    - name: Build custom action DLLs
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: |
        msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:Platform=Win32 /p:SolutionDir=${{ github.workspace }}\ src\ca\jsonca.vcxproj
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:Platform=ARM64 /p:SolutionDir=${{ github.workspace }}\ src\ca\jsonca.vcxproj
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:Platform=x64 /p:SolutionDir=${{ github.workspace }}\ src\ca\jsonca.vcxproj
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Sign custom action DLLs
      shell: pwsh
      env:
        SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
        SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
      run: |
        if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_BASE64) -or
            [string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_PASSWORD)) {
          throw "Set WINDOWS_SIGNING_CERTIFICATE_BASE64 and WINDOWS_SIGNING_CERTIFICATE_PASSWORD repository secrets before releasing."
        }

        $signTool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
          Where-Object { $_.Directory.Name -eq "x64" } |
          Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
          Select-Object -First 1
        if (-not $signTool) { throw "Windows SDK SignTool was not found." }

        $certificatePath = Join-Path $env:RUNNER_TEMP "windows-signing-certificate.pfx"
        try {
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64))
          $dlls = @(
            "Win32\Release\jsonca.dll",
            "x64\Release\jsonca.dll",
            "ARM64\Release\jsonca.dll"
          )
          foreach ($dll in $dlls) {
            if (-not (Test-Path $dll)) { throw "Custom action DLL not found: $dll" }
            & $signTool.FullName sign /f $certificatePath /p $env:SIGNING_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $dll
            if ($LASTEXITCODE -ne 0) { throw "Signing failed for $dll" }
            & $signTool.FullName verify /pa /all $dll
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed for $dll" }
          }
        } finally {
          Remove-Item $certificatePath -Force -ErrorAction SilentlyContinue
        }

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} ${{env.SOLUTION_FILE_PATH}}

    - name: Pack
      working-directory: ${{env.SOLUTION_FILE_PATH}}\src\wixext\
      run: dotnet pack --no-build --configuration ${{env.BUILD_CONFIGURATION}} /p:Version=${{ steps.version.outputs.version }}

    # A package missing one of the wixextN/ folders makes WiX report the extension as unsupported
    # on that version (issue #45). Check before publishing to NuGet, where it cannot be undone.
    - name: Verify package layout
      shell: pwsh
      working-directory: ${{env.SOLUTION_FILE_PATH}}\src\wixext\bin\${{env.BUILD_CONFIGURATION}}\
      run: |
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $nupkg = Get-ChildItem -Filter "*.nupkg" | Select-Object -First 1
        if (-not $nupkg) { Write-Error "No .nupkg found"; exit 1 }
        $zip = [System.IO.Compression.ZipFile]::OpenRead($nupkg.FullName)
        $entries = $zip.Entries.FullName
        $zip.Dispose()
        $entries | Sort-Object | ForEach-Object { Write-Host "  $_" }
        $missing = @("wixext4/WixJsonFileExtension.dll",
                     "wixext5/WixJsonFileExtension.dll",
                     "wixext6/WixJsonFileExtension.dll",
                     "wixext7/WixJsonFileExtension.dll") | Where-Object { $entries -notcontains $_ }
        if ($missing) { Write-Error "Missing from $($nupkg.Name): $($missing -join ', ')"; exit 1 }
        Write-Host "Package contains extension binaries for WiX 4, 5, 6 and 7."

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        name: Release ${{ steps.version.outputs.version }}
        # Auto-generate a "What's Changed" changelog from merged PRs since the
        # previous tag. The install snippet below is prepended to those notes.
        generate_release_notes: true
        body: |
          ## Installation
          ```
          dotnet add package WixJsonFileExtension --version ${{ steps.version.outputs.version }}
          ```
        files: |
          ${{env.SOLUTION_FILE_PATH}}\src\wixext\bin\${{env.BUILD_CONFIGURATION}}\WixJsonFileExtension.${{ steps.version.outputs.version }}.nupkg
        draft: false
        prerelease: false

    # Trusted Publishing: exchange this workflow's OIDC token for a short-lived NuGet.org
    # API key. Requires a Trusted Publishing policy on nuget.org (account: hegsie) that
    # trusts this repository and workflow file; no stored NUGET_API_KEY secret is used.
    - name: NuGet login (Trusted Publishing)
      id: nuget-login
      uses: NuGet/login@v1
      with:
        user: hegsie

    - name: Push to NuGet
      working-directory: ${{env.SOLUTION_FILE_PATH}}\src\wixext\bin\${{env.BUILD_CONFIGURATION}}\
      run: dotnet nuget push "*.nupkg" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
