# This workflow creates a GitHub release and publishes the package to NuGet
# It is triggered manually or by pushing a version tag (e.g., v6.0.0)

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 6.0.0)'
        required: true
        type: string
  push:
    tags:
      - 'v*.*.*'

env:
  SOLUTION_FILE_PATH: .
  BUILD_CONFIGURATION: Release

permissions:
  contents: write
  # Required for NuGet Trusted Publishing: the workflow exchanges its OIDC token for a
  # short-lived NuGet.org API key instead of using a stored long-lived key.
  id-token: write
  # Required by the SignPath action: it uses GITHUB_TOKEN to read job details and download the
  # unsigned-ca artifact.
  actions: read

jobs:
  release:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Determine Version
      id: version
      shell: pwsh
      run: |
        if ("${{ github.event_name }}" -eq "workflow_dispatch") {
          $version = "${{ inputs.version }}"
        } else {
          $version = "${{ github.ref_name }}" -replace '^v', ''
        }
        echo "version=$version" >> $env:GITHUB_OUTPUT
        echo "Version: $version"
        # Four-part numeric form for the jsonca.dll version resource (prerelease suffix dropped,
        # missing parts set to 0).
        $v = [version]($version -replace '-.*$', '')
        $fileVersion = "$($v.Major).$($v.Minor).$([Math]::Max($v.Build, 0)).$([Math]::Max($v.Revision, 0))"
        echo "fileversion=$fileVersion" >> $env:GITHUB_OUTPUT
        echo "File version: $fileVersion"

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    # Build the custom action DLL for the non-x64 platforms first: the wixlib compiles its
    # x86/ARM64 fragments (and embeds those DLLs) only when the outputs exist, so released
    # packages must carry all three platforms.
    - name: Build x86 and ARM64 custom action DLLs
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: |
        msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:Platform=Win32 /p:JsonCaVersion=${{ steps.version.outputs.fileversion }} /p:SolutionDir=${{ github.workspace }}\ src\ca\jsonca.vcxproj
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:Platform=ARM64 /p:JsonCaVersion=${{ steps.version.outputs.fileversion }} /p:SolutionDir=${{ github.workspace }}\ src\ca\jsonca.vcxproj
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:Platform=x64 /p:JsonCaVersion=${{ steps.version.outputs.fileversion }} /p:SolutionDir=${{ github.workspace }}\ src\ca\jsonca.vcxproj
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    # Authenticode-sign the custom action DLLs (issue #56) before the wixlib embeds them, so they
    # are signed inside every MSI built with the extension. Signing is done by SignPath Foundation
    # (free for open source). Skipped until the SIGNPATH_ORGANIZATION_ID repository variable and
    # SIGNPATH_API_TOKEN secret are configured, so releases keep working unsigned until then.
    - name: Upload unsigned custom action DLLs
      id: upload-unsigned
      if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: unsigned-ca
        path: |
          x64/${{env.BUILD_CONFIGURATION}}/jsonca.dll
          Win32/${{env.BUILD_CONFIGURATION}}/jsonca.dll
          ARM64/${{env.BUILD_CONFIGURATION}}/jsonca.dll

    - name: Sign custom action DLLs (SignPath)
      if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
      uses: signpath/github-action-submit-signing-request@v1
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        project-slug: WixJsonFileExtension
        signing-policy-slug: release-signing
        artifact-configuration-slug: custom-action-dlls
        github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
        wait-for-completion: true
        # Signing requests are approved manually in SignPath (see CODE_SIGNING.md); allow an hour
        # instead of the action's 10-minute default. Well within the job's 6-hour limit.
        wait-for-completion-timeout-in-seconds: 3600
        output-artifact-directory: ${{ github.workspace }}

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      # JsonCaVersion must match the custom action builds above: a different value changes the
      # resource compiler command line, which would rebuild and relink jsonca and drop its signature.
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:JsonCaVersion=${{ steps.version.outputs.fileversion }} ${{env.SOLUTION_FILE_PATH}}

    # The solution build must have treated jsonca as up to date; a relink would have replaced the
    # signed DLLs with unsigned ones before the wixlib embedded them.
    - name: Verify custom action DLLs are signed
      if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
      shell: pwsh
      run: |
        foreach ($p in @("x64", "Win32", "ARM64")) {
          $dll = "${{ github.workspace }}\$p\${{env.BUILD_CONFIGURATION}}\jsonca.dll"
          $sig = Get-AuthenticodeSignature $dll
          Write-Host "$p jsonca.dll: $($sig.Status) $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne "Valid") { Write-Error "$dll is not validly signed"; exit 1 }
        }

    - name: Pack
      working-directory: ${{env.SOLUTION_FILE_PATH}}\src\wixext\
      run: dotnet pack --no-build --configuration ${{env.BUILD_CONFIGURATION}} /p:Version=${{ steps.version.outputs.version }}

    # A package missing one of the wixextN/ folders makes WiX report the extension as unsupported
    # on that version (issue #45). Check before publishing to NuGet, where it cannot be undone.
    - name: Verify package layout
      shell: pwsh
      working-directory: ${{env.SOLUTION_FILE_PATH}}\src\wixext\bin\${{env.BUILD_CONFIGURATION}}\
      run: |
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $nupkg = Get-ChildItem -Filter "*.nupkg" | Select-Object -First 1
        if (-not $nupkg) { Write-Error "No .nupkg found"; exit 1 }
        $zip = [System.IO.Compression.ZipFile]::OpenRead($nupkg.FullName)
        $entries = $zip.Entries.FullName
        $zip.Dispose()
        $entries | Sort-Object | ForEach-Object { Write-Host "  $_" }
        $missing = @("wixext4/WixJsonFileExtension.dll",
                     "wixext5/WixJsonFileExtension.dll",
                     "wixext6/WixJsonFileExtension.dll",
                     "wixext7/WixJsonFileExtension.dll") | Where-Object { $entries -notcontains $_ }
        if ($missing) { Write-Error "Missing from $($nupkg.Name): $($missing -join ', ')"; exit 1 }
        Write-Host "Package contains extension binaries for WiX 4, 5, 6 and 7."

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        name: Release ${{ steps.version.outputs.version }}
        # Auto-generate a "What's Changed" changelog from merged PRs since the
        # previous tag. The install snippet below is prepended to those notes.
        generate_release_notes: true
        body: |
          ## Installation
          ```
          dotnet add package WixJsonFileExtension --version ${{ steps.version.outputs.version }}
          ```
        files: |
          ${{env.SOLUTION_FILE_PATH}}\src\wixext\bin\${{env.BUILD_CONFIGURATION}}\WixJsonFileExtension.${{ steps.version.outputs.version }}.nupkg
        draft: false
        prerelease: false

    # Trusted Publishing: exchange this workflow's OIDC token for a short-lived NuGet.org
    # API key. Requires a Trusted Publishing policy on nuget.org (account: hegsie) that
    # trusts this repository and workflow file; no stored NUGET_API_KEY secret is used.
    - name: NuGet login (Trusted Publishing)
      id: nuget-login
      uses: NuGet/login@v1
      with:
        user: hegsie

    - name: Push to NuGet
      working-directory: ${{env.SOLUTION_FILE_PATH}}\src\wixext\bin\${{env.BUILD_CONFIGURATION}}\
      run: dotnet nuget push "*.nupkg" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
